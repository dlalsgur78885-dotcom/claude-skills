# dev 스택 전용 nginx — prod 의 /opt/carousel/nginx.conf 와 무관하다.
# 프론트와 API 를 한 포트로 묶어 prod 와 같은 same-origin 구조를 만든다.
# (그래야 프론트 번들에 박히는 NEXT_PUBLIC_API_URL 을 "/api" 로 둘 수 있다)
#
# SSL 없음 — dev 는 SSH 터널 또는 내부망으로만 접근한다.

server {
    listen 80;
    server_name _;

    # 업로드/미리보기 이미지가 커서 prod 와 같은 여유를 준다
    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Vision/이미지 처리가 오래 걸릴 수 있다 (prod 와 동일하게 180s)
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location /health {
        proxy_pass http://backend:8000/health;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
