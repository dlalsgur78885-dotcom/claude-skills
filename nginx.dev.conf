# dev 스택 전용 nginx — prod 의 /opt/carousel/nginx.conf 와 무관하다.
# 프론트와 API 를 한 포트로 묶어 prod 와 같은 same-origin 구조를 만든다.
# (그래야 프론트 번들에 박히는 NEXT_PUBLIC_API_URL 을 "/api" 로 둘 수 있다)
#
# TLS 는 prod 가 이미 발급받아 둔 Let's Encrypt 인증서를 **읽기 전용으로 같이** 쓴다.
# prod 의 nginx.conf·443 포트·인증서 파일은 하나도 건드리지 않는다 — 읽기만 한다.
# 인증서 CN 이 3-35-18-166.sslip.io 이므로 https://3-35-18-166.sslip.io:3443 으로
# 접근해야 인증서가 맞는다. (IP 로 직접 접근하면 이름 불일치 경고가 뜬다)
#
# ⚠ 갱신 주의: certbot 갱신 cron 은 prod nginx 만 재시작한다. 갱신 후 dev 는 옛
#    인증서를 물고 있으므로 dev nginx 도 한 번 restart 해야 한다.
#    (다음 만료: 2026-10-10)

server {
    listen 80;          # 터널 전용 (호스트에서 127.0.0.1:3001 로만 바인딩)
    listen 443 ssl;     # 직접 접근용 (호스트 3443)
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/3-35-18-166.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/3-35-18-166.sslip.io/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 업로드/미리보기 이미지가 커서 prod 와 같은 여유를 준다
    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Vision/이미지 처리가 오래 걸릴 수 있다 (prod 와 동일하게 180s)
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location /health {
        proxy_pass http://backend:8000/health;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
