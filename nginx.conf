# Plain HTTP — handles Let's Encrypt webroot challenge + redirects everything else to HTTPS.
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Optional: comment this out until you've successfully issued an SSL cert.
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — comment out the entire block on first deploy (before SSL is issued),
# then re-enable after `certbot certonly --webroot` succeeds.
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/REPLACE_WITH_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/REPLACE_WITH_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Vision template generation can take ~90s; bump proxy timeouts.
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    client_max_body_size 32m;  # logo + font uploads (backend caps fonts at 30MB)

    # API → FastAPI backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health passthrough for monitoring
    location /health {
        proxy_pass http://backend:8000/health;
    }

    # Everything else → Next.js
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js dev HMR uses websockets; production standalone doesn't need them,
        # but harmless to leave on.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
